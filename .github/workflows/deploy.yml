name: Deploy Eval Pemdi to VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Linux VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.TARGET_DIR || '/var/www/eval_pemdi' }}"

            echo "🚀 Menyiapkan direktori proyek di VPS ($TARGET_DIR)..."
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "📂 Direktori belum memiliki repo Git. Melakukan clone..."
              mkdir -p "$TARGET_DIR"
              git clone https://github.com/dodiPra49/Eval_Pemdi.git "$TARGET_DIR"
            fi

            cd "$TARGET_DIR" || exit 1

            echo "📥 Mengambil source code terbaru dari GitHub..."
            git fetch --all
            git reset --hard origin/master 2>/dev/null || git reset --hard origin/main

            echo "📝 Menyiapkan konfigurasi environment .env untuk Docker & MariaDB..."
            cat << EOF > .env
            PORT=${{ secrets.APP_PORT || '80' }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD || 'root_evalpemdi_2026' }}
            DB_USER=${{ secrets.DB_USER || 'evalpemdi_user' }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD || 'evalpemdi_pass_2026' }}
            DB_NAME=${{ secrets.DB_NAME || 'EvalPemdi' }}
            JWT_SECRET=${{ secrets.JWT_SECRET || 'eval_pemdi_jwt_secret_key_2026' }}
            VITE_GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY || '' }}
            GEMINI_API_KEY=${{ secrets.VITE_GEMINI_API_KEY || '' }}
            EOF

            echo "🐳 Build dan jalankan seluruh container (MariaDB, API, Web)..."
            docker compose down --remove-orphans || true
            docker compose up -d --build

            echo "🧹 Membersihkan image lama yang tidak terpakai..."
            docker image prune -f

            echo "✅ Deployment selesai! Seluruh layanan aktif di http://${{ secrets.VPS_HOST }}:${{ secrets.APP_PORT || '80' }}"
